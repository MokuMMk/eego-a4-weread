# flash.kever.ink - eego A4 网页刷机工具
server {
    listen 80;
    server_name flash.kever.ink;

    root /var/www/flasher;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 固件文件不缓存（方便更新）
    location /firmware/ {
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Expose-Headers "Last-Modified, Content-Length, ETag";
    }

    # HTML 不缓存
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
